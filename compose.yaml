services:
    mentis:
        build:
            context: .
        image: mentisetterna:latest
        container_name: mentisetterna
        restart: unless-stopped
        ports:
            - "${MENTIS_HTTP_PORT:-8080}:8080"
        environment:
            # Secrets only — all non-secret config lives in config.toml.
            BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:-}"
            MEDIA_S3_PRIMARY_ACCESS_KEY_ID: "${MEDIA_S3_PRIMARY_ACCESS_KEY_ID:-}"
            MEDIA_S3_PRIMARY_SECRET_ACCESS_KEY: "${MEDIA_S3_PRIMARY_SECRET_ACCESS_KEY:-}"
        volumes:
            - ./mentis-data:/data
            # Optional override of the baked /app/config.toml (config.container.toml
            # defaults; see comment below). Create config.toml first by copying
            # config.default.toml — a missing file becomes an empty directory mount
            # and shadows the baked config. Point [database].path / [media].cache_dir
            # at /data for container persistence, and set [[media.endpoints]] if you
            # use S3 (keys stay env: MEDIA_S3_<ID>_ACCESS_KEY_ID / _SECRET_ACCESS_KEY).
            - ./config.toml:/app/config.toml
        extra_hosts:
            - "host.docker.internal:host-gateway"

